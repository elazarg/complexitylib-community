name = "cslib-frontier"
version = "0.2.0"
defaultTargets = ["CslibFrontier"]

# Linter settings follow cslib-frontier, so every module compiles unchanged when
# it is upstreamed.
[leanOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false
weak.linter.unicodeLinter = false
autoImplicit = false

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "v4.36.0"

[[lean_lib]]
name = "CslibFrontier"
roots = []
globs = ["CslibFrontier.+"]
